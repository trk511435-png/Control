<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الشركة - Business Simulator</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h1, h2 { color: #4CAF50; text-align: center; }
        .section { background: #2c2c2c; padding: 15px; margin-bottom: 20px; border-radius: 8px; }
        input, button, select { width: 100%; padding: 10px; margin: 8px 0; border-radius: 5px; border: none; }
        input, select { background: #333; color: #fff; }
        button { background: #4CAF50; color: white; font-weight: bold; cursor: pointer; }
        button:hover { background: #45a049; }
        .email-box { background: #333; padding: 10px; margin: 5px 0; border-radius: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h1>لوحة تحكم المدير (CEO Dashboard)</h1>

    <!-- قسم ربط الحساب بروبلوكس -->
    <div class="section">
        <h2>ربط حساب روبلوكس</h2>
        <input type="text" id="robloxUser" placeholder="اكتب اسم المستخدم في روبلوكس (Roblox Username)">
        <button onclick="linkAccount()">ربط الحساب بالسيرفر</button>
        <p id="linkStatus" style="color: yellow; text-align: center;"></p>
    </div>

    <!-- نظام الإيميلات ورسائل الموظفين -->
    <div class="section">
        <h2>إيميل الشركة (رسائل الموظفين وطلبات التوظيف)</h2>
        <div id="emailsList">
            <div class="email-box">
                <p><strong>من:</strong> موظف جديد (أحمد)</p>
                <p><strong>الرسالة:</strong> أقدم على وظيفة كفني إلكترونيات، بانتظار الرد.</p>
                <button style="width: auto; padding: 5px 15px;" onclick="replyEmail('أحمد')">رد على الموظف وترقية</button>
            </div>
        </div>
    </div>

    <!-- نظام البطاقة البنكية -->
    <div class="section">
        <h2>إدارة البنك والبطاقة الرقمية</h2>
        <input type="text" id="cardNum" placeholder="رقم البطاقة البنكية (16 رقم)">
        <input type="text" id="cardCvv" placeholder="رمز الأمان (CVV)">
        <button onclick="saveCard()">ربط البطاقة ودفع الرسوم (للشراء والأسهم)</button>
        <button style="background: #d32f2f;" onclick="blockCard()">إيقاف البطاقة (في حال التسريب وحفظ 30%)</button>
    </div>

    <!-- سوق الأسهم والأراضي (الحصري بالموقع) -->
    <div class="section">
        <h2>متجر الأسهم والأراضي الحصري</h2>
        <p>شراء الأراضي، بيع الشركة، أو الاستثمار في الأسهم يتم هنا حصرياً:</p>
        <button onclick="buyLandOrStock()">شراء أرض أو أسهم جديدة</button>
        <button style="background: #c2185b;" onclick="sellCompany()">بيع الشركة بالكامل</button>
    </div>

</div>

<script>
    // روابط تجريبية للسيرفر الخلفي (Backend) اللي بتسويه لاحقاً
    const backendURL = "https://your-backend-server.onrender.com"; 

    function linkAccount() {
        const username = document.getElementById("robloxUser").value;
        if(!username) {
            alert("الرجاء كتابة اسم المستخدم!");
            return;
        }
        document.getElementById("linkStatus").innerText = "جاري الربط مع حساب: " + username + "...";
        // هنا بيتم إرسال الطلب لـ Backend عبر Fetch API
    }

    function replyEmail(employeeName) {
        alert("تم فتح نافذة الرد على الموظف: " + employeeName);
    }

    function saveCard() {
        const num = document.getElementById("cardNum").value;
        if(num.length < 16) {
            alert("رقم البطاقة غير صحيح!");
            return;
        }
        alert("تم ربط البطاقة بنجاح، يمكنك الآن الشراء والدفع من الموقع.");
    }

    function blockCard() {
        alert("تم إيقاف البطاقة بنجاح! تم استرجاع 30% من رسوم الإصدار لحسابك البنكي.");
    }

    function buyLandOrStock() {
        alert("جاري إرسال طلب الشراء إلى السيرفر المالي...");
    }

    function sellCompany() {
        if(confirm("هل أنت متأكد من رغبتك في بيع الشركة حصرياً عبر الموقع؟")) {
            alert("تم عرض الشركة للبيع في السوق المالي!");
        }
    }
</script>

</body>
</html>
