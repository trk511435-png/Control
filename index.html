<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>محاكي الشركة - لوحة البنك</title>
    <!-- استدعاء مكتبة MQTT للاتصال اللحظي -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0f172a; color: #fff; text-align: center; margin: 0; padding: 50px; }
        .card { background: #1e293b; max-width: 400px; margin: 0 auto; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        input { width: 80%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; font-size: 16px; text-align: center; }
        button { background: #3b82f6; color: #fff; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; width: 85%; }
        button:hover { background: #2563eb; }
        .hidden { display: none; }
        .money { font-size: 28px; color: #10b981; font-weight: bold; margin: 20px 0; }
    </style>
</head>
<body>

    <div class="card">
        <!-- قسم تسجيل الدخول برمز الـ 6 أرقام -->
        <div id="login-section">
            <h2>تسجيل دخول البنك</h2>
            <p>أدخل كود الربط المكون من 6 أرقام الظهور لك داخل اللعبة:</p>
            <input type="text" id="auth-code" placeholder="123456" maxlength="6">
            <br>
            <button onclick="loginToBank()">ربط ودخول</button>
        </div>

        <!-- لوحة معلومات البنك (تظهر بعد تسجيل الدخول) -->
        <div id="bank-section" class="hidden">
            <h2>حساب الشركة البنكي</h2>
            <p id="player-name">جاري الاتصال...</p>
            <div class="money" id="balance-display">$0</div>
            <button onclick="depositMoney()">إيداع / تحديث الرصيد</button>
        </div>
    </div>

    <script>
        let client;
        
        function loginToBank() {
            const code = document.getElementById('auth-code').value;
            if (code.length !== 6) {
                alert('الرجاء إدخال كود صحيح من 6 أرقام');
                return;
            }

            // الاتصال بسيرفر MQTT (استبدل البيانات بما يناسب سيرفرك)
            client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');

            client.on('connect', function () {
                console.log('تم الاتصال بالسيرفر بنجاح');
                // الاشتراك بقناة خاصة بهذا الكود
                client.subscribe('company/sim/bank/' + code);
                
                // اخفاء صفحة الدخول وإظهار البنك
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('bank-section').classList.remove('hidden');
                document.getElementById('player-name').innerText = 'تم الربط بنجاح (كود: ' + code + ')';
            });

            client.on('message', function (topic, payload) {
                // استلام تحديثات الفلوس لحظياً من اللعبة
                const data = JSON.parse(payload.toString());
                if(data.balance !== undefined) {
                    document.getElementById('balance-display').innerText = '$' + data.balance;
                }
            });
        }

        function depositMoney() {
            if(client && client.connected) {
                // إرسال أمر أو تحديث للسيرفر إذا لزم الأمر
                alert('تم إرسال طلب التحديث بنجاح');
            }
        }
    </script>

</body>
</html>
